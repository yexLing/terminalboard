name: Publish to PyPI

# Publishes to PyPI whenever a version tag (v*) is pushed, or on manual dispatch.
# Uses PyPI Trusted Publishing (OIDC) — no API token or secret required.
# One-time PyPI setup: Your account -> Publishing -> add a (pending) publisher
#   Project: terminalboard | Owner: yexLing | Repo: terminalboard
#   Workflow: publish.yml   | Environment: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi          # must match the PyPI trusted-publisher config
    permissions:
      id-token: write          # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
